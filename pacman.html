<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Vector-Physics Pac-Man</title>
<style>
:root{color-scheme:dark;--bg:#080b15;--blue:#087cff;--yellow:#ffef00;--pink:#ffb8ae}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#14264a 0%,#090d19 52%,#05070d 100%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eef4ff;display:flex;justify-content:center;padding:18px}.wrap{width:min(100%,1000px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}.title{font-size:clamp(1.25rem,3vw,2rem);font-weight:900;letter-spacing:.04em}.title span{color:var(--yellow);text-shadow:0 0 18px #ffef0066}.tag{font-size:.8rem;color:#9fb8df;border:1px solid #2b416b;padding:6px 10px;border-radius:999px}.hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.pill{background:#101a2d;border:1px solid #263858;border-radius:12px;padding:8px 13px;color:#a9bfdf;font-size:.9rem}.pill b{color:#fff;margin-left:5px}.gameframe{background:#050914;border:1px solid #25416e;border-radius:18px;padding:8px;box-shadow:0 0 0 1px #0c1c36,0 16px 50px #0009,0 0 36px #087cff16;overflow:hidden}canvas{display:block;width:100%;height:auto;aspect-ratio:9/7;background:#0a0a12;border-radius:12px;touch-action:none}.below{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 2px}.hint{color:#91a5c8;font-size:.9rem;line-height:1.5}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;color:#edf5ff;background:linear-gradient(#1a2b49,#111c31);border:1px solid #36527e;border-radius:10px;padding:9px 13px;cursor:pointer}button:hover{border-color:#70aaff;background:#1a3154}button:active{transform:translateY(1px)}.mobile{display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,44px);gap:5px;justify-content:center;margin:10px auto}.mobile button{padding:0;font-size:1.2rem;touch-action:manipulation}.mobile .up{grid-column:2}.mobile .left{grid-column:1;grid-row:2}.mobile .down{grid-column:2;grid-row:2}.mobile .right{grid-column:3;grid-row:2}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#02040ac9;padding:20px;z-index:5}.overlay.show{display:flex}.panel{width:min(440px,100%);text-align:center;background:#101a2e;border:1px solid #31538a;border-radius:20px;padding:26px;box-shadow:0 0 60px #087cff22}.panel h2{font-size:2rem;margin:0 0 8px;color:var(--yellow)}.panel p{color:#b6c7e4}.panel button{margin-top:8px;background:#173c75;border-color:#3f8cff}@media(max-width:650px){body{padding:10px}.gameframe{padding:4px;border-radius:12px}.mobile{display:grid}.hint{font-size:.82rem}}
</style></head><body><main class="wrap"><header><div class="title">VECTOR-PHYSICS <span>PAC-MAN</span></div><div class="tag">NEON ARCADE • HTML EDITION</div></header><section class="hud"><div class="pill">SCORE <b id="score">0</b></div><div class="pill">DOTS LEFT <b id="dots">0</b></div><div class="pill">STATUS <b id="status">READY</b></div></section><div class="gameframe"><canvas id="game" width="900" height="700" aria-label="Pac-Man game canvas"></canvas></div><div class="mobile" aria-label="Touch controls"><button class="up" data-key="arrowup">▲</button><button class="left" data-key="arrowleft">◀</button><button class="down" data-key="arrowdown">▼</button><button class="right" data-key="arrowright">▶</button></div><div class="below"><div class="hint"><b>Move:</b> Arrow keys or WASD · <b>Restart:</b> R<br>Keep moving, collect the glowing dots, and avoid the ghost.</div><div class="buttons"><button id="soundBtn">Sound: On</button><button id="restart">Restart game ↻</button></div></div></main><div class="overlay" id="overlay"><div class="panel"><h2 id="endTitle">GAME OVER</h2><p id="endText">The ghost caught you!</p><button id="again">Play again</button></div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),dotsEl=document.getElementById('dots'),statusEl=document.getElementById('status'),overlay=document.getElementById('overlay'),endTitle=document.getElementById('endTitle'),endText=document.getElementById('endText');
const W=900,H=700, WALL='#0066ff', BG='#0a0a12', PINK='#ffb8ae', YELLOW='#ffee00';
const wallDefs=[[20,20,860,20],[20,660,860,20],[20,20,20,660],[860,20,20,660],[120,100,200,40],[580,100,200,40],[420,40,60,160],[120,220,100,120],[680,220,100,120],[300,280,300,40],[120,420,200,40],[580,420,200,40],[420,480,60,120]];
let walls=[],pellets=[],player,ghost,score=0,gameOver=false,won=false,mouth=5,mouthDir=1,heading=0,keys={},last=0,raf=0,soundOn=true,audioCtx=null,stepSoundAt=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){walls=wallDefs.map(([x,y,w,h])=>({x,y,w,h}));player={x:70,y:70,vx:0,vy:0,ax:0,ay:0,r:18,mass:1,friction:.88,max:4.5,power:.65};ghost={x:450,y:380,vx:0,vy:0,ax:0,ay:0,r:18,mass:1,friction:.88,max:4.5,power:.32};pellets=[];for(let x=70;x<830;x+=45)for(let y=70;y<630;y+=45){let box={x:x-4,y:y-4,w:8,h:8};if(!walls.some(w=>box.x<w.x+w.w&&box.x+box.w>w.x&&box.y<w.y+w.h&&box.y+box.h>w.y))pellets.push({x,y,r:3.1,phase:Math.random()*Math.PI*2});}score=0;gameOver=false;won=false;mouth=5;mouthDir=1;heading=0;keys={};overlay.classList.remove('show');statusEl.textContent='PLAYING';updateHud();draw();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function closestCollision(e,w){let x=clamp(e.x,w.x,w.x+w.w),y=clamp(e.y,w.y,w.y+w.h);return Math.hypot(e.x-x,e.y-y)<e.r}
function physics(e){e.vx+=e.ax;e.vy+=e.ay;e.vx*=e.friction;e.vy*=e.friction;e.ax=0;e.ay=0;let speed=Math.hypot(e.vx,e.vy);if(speed>e.max){e.vx=e.vx/speed*e.max;e.vy=e.vy/speed*e.max}
 e.x+=e.vx;for(const w of walls)if(closestCollision(e,w)){if(e.vx>0)e.x=w.x-e.r;else if(e.vx<0)e.x=w.x+w.w+e.r;e.vx*=-.25}
 e.y+=e.vy;for(const w of walls)if(closestCollision(e,w)){if(e.vy>0)e.y=w.y-e.r;else if(e.vy<0)e.y=w.y+w.h+e.r;e.vy*=-.25}
 e.x=clamp(e.x,20+e.r,880-e.r);e.y=clamp(e.y,20+e.r,680-e.r)}
function force(e,x,y,p){e.ax+=x*p/e.mass;e.ay+=y*p/e.mass}
function sound(freq=440,dur=.045,type='square',vol=.035){if(!soundOn)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function update(dt,time){if(gameOver||won)return;let ix=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),iy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);if(ix||iy){let n=Math.hypot(ix,iy);force(player,ix/n,iy/n,player.power);heading=Math.atan2(-player.vy||-iy,player.vx||ix)}physics(player);
 let dx=player.x-ghost.x,dy=player.y-ghost.y,d=Math.hypot(dx,dy)||1;force(ghost,dx/d+(Math.random()-.5)*.22,dy/d+(Math.random()-.5)*.22,ghost.power);physics(ghost);
 if(Math.hypot(player.vx,player.vy)>.2){mouth+=mouthDir*dt*2.8;if(mouth>44){mouth=44;mouthDir=-1}if(mouth<5){mouth=5;mouthDir=1}if(time-stepSoundAt>210){sound(420,.025,'square',.012);stepSoundAt=time}}else{mouth=5+Math.sin(time/190)*2}
 for(let i=pellets.length-1;i>=0;i--){let p=pellets[i];if(Math.hypot(player.x-p.x,player.y-p.y)<player.r+4){pellets.splice(i,1);score+=10;sound(560,.04,'square',.04)}}if(pellets.length===0){won=true;finish(true)}else if(Math.hypot(player.x-ghost.x,player.y-ghost.y)<player.r+ghost.r-4){gameOver=true;sound(150,.42,'sine',.09);finish(false)}updateHud()}
function updateHud(){scoreEl.textContent=score;dotsEl.textContent=pellets.length}
function glow(color,blur){ctx.shadowColor=color;ctx.shadowBlur=blur}
function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#090d19');bg.addColorStop(1,'#050711');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // subtle scanlines and ambient stars
 ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle='#2c4b78';ctx.lineWidth=1;for(let y=8;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();
 for(const w of walls){ctx.save();glow('#087cff',14);ctx.fillStyle=WALL;roundRect(w.x,w.y,w.w,w.h,5);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#061d48';roundRect(w.x+3,w.y+3,w.w-6,w.h-6,3);ctx.fill();ctx.restore()}
 for(const p of pellets){let pulse=.75+.25*Math.sin(performance.now()/180+p.phase);ctx.save();glow(PINK,8*pulse);ctx.fillStyle=PINK;ctx.beginPath();ctx.arc(p.x,p.y,p.r*pulse,0,Math.PI*2);ctx.fill();ctx.restore()}
 drawPac();drawGhost();if(gameOver||won){ctx.save();ctx.fillStyle='#02061177';ctx.fillRect(20,20,860,640);ctx.restore()}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h));}
function drawPac(){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(heading);glow(YELLOW,23);ctx.fillStyle=YELLOW;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,player.r,mouth*Math.PI/180,(360-mouth)*Math.PI/180);ctx.closePath();ctx.fill();ctx.restore()}
function drawGhost(){ctx.save();ctx.translate(ghost.x,ghost.y);glow('#ff3c3c',20);ctx.fillStyle='#ff3c3c';ctx.beginPath();ctx.arc(0,0,ghost.r,Math.PI,0);ctx.lineTo(ghost.r,ghost.r-1);ctx.lineTo(ghost.r*.5,ghost.r*.68);ctx.lineTo(0,ghost.r);ctx.lineTo(-ghost.r*.5,ghost.r*.68);ctx.lineTo(-ghost.r,ghost.r-1);ctx.closePath();ctx.fill();ctx.shadowBlur=0;let sp=Math.hypot(ghost.vx,ghost.vy)||1,ox=ghost.vx/sp*3,oy=ghost.vy/sp*3;for(let ex of [-7,7]){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex, -3,5.5,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#073bff';ctx.beginPath();ctx.arc(ex+ox,-3+oy,2.6,0,Math.PI*2);ctx.fill()}ctx.restore()}
function finish(win){statusEl.textContent=win?'YOU WIN!':'GAME OVER';endTitle.textContent=win?'MAZE CLEARED!':'GAME OVER';endText.textContent=win?'Every dot collected. Incredible run!':'The ghost caught you. Try again and keep moving!';overlay.classList.add('show')}
function loop(t){let dt=Math.min((t-last)/16.667,2);last=t;update(dt,t);draw();raf=requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(k==='r')reset()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);window.addEventListener('blur',()=>keys={});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const down=e=>{e.preventDefault();keys[k]=true},up=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});document.getElementById('restart').onclick=reset;document.getElementById('again').onclick=reset;document.getElementById('soundBtn').onclick=()=>{soundOn=!soundOn;document.getElementById('soundBtn').textContent='Sound: '+(soundOn?'On':'Off');if(soundOn)sound(520,.05)};
reset();
})();
</script></body></html>
